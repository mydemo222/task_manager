<!-- templates/index.html -->
{% extends "base.html" %}

{% block content %}
    <h2>Your Tasks</h2>
    
    <form action="{{ url_for('search') }}" method="get">
        <div class="form-group">
            <input type="text" name="query" placeholder="Search tasks..." value="{{ search_query if search_query else '' }}">
            <button type="submit" class="btn">Search</button>
        </div>
    </form>
    
    <div class="task-list">
        {% if tasks %}
            {% for task in tasks %}
                <div class="task {% if task.status == 'completed' %}completed{% endif %}">
                    <h3>{{ task.title }}</h3>
                    <p>{{ task.description }}</p>
                    <p><strong>Due Date:</strong> {{ task.due_date }}</p>
                    <p><strong>Status:</strong> {{ task.status }}</p>
                    <a href="{{ url_for('update_task', id=task.id) }}" class="btn">Edit</a>
                    <a href="{{ url_for('delete_task', id=task.id) }}" class="btn">Delete</a>
                </div>
            {% endfor %}
        {% else %}
            <p>No tasks found.</p>
        {% endif %}
    </div>
{% endblock %}
